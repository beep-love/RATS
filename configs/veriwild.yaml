# ==========================================
# RATS configuration: VeRi-Wild
# Default = RATS (Sampling-Only). Other methods are selected with
# --set overrides using provided scripts
# ==========================================
experiment_name: "veriwild"
output_dir: "runs/veriwild"
checkpoint_dir: "checkpoints/veriwild"

seed: 1
cuda_deterministic: True

# --- Dataset (paths are relative to the repository root) ---
dataset: "veri_wild"
data_root: "data/VeRi-Wild"
xml_file: "train_test_split/train_list_start0.txt"   # relative to data_root
train_val_split: 0.8

# --- Model ---
model_type: "resnet50"
pretrained: True
emb_dim: 128
imagenet_pretrained: True
ssl_pretrained_path: " "

# --- Training ---
epochs: 50
batch_size_p: 32             # identities per batch
batch_size_k: 4              # samples per identity
image_size: 256
crop_size: 224

loss_type: "triplet"
sampling_strategy: "distance_weighted"   # used only when rl.enabled is False
                                         # options: "batch_hard", "semi_hard", "distance_weighted"

# --- Optimization ---
lr: 0.000035
weight_decay: 0.0004
warmup: False
warmup_epochs: 5
lr_decay: True
lr_decay_step: 25       # half of training
lr_decay_gamma: 0.3

# --- Margin ---
init_margin: 0.2

# ==========================================
# RL miner (RATS)
# ==========================================
rl:
  enabled: True
  adaptive_margin: False                   # True = Joint variant
  adaptive_sampling: True
  adaptive_sampling_strategy: "weighting"  # reported experiments use "weighting"

  margin_step: 0.01
  min_margin: 0.15
  max_margin: 0.25
  region_step: 0.10                        # Delta_l
  logit_clamp: 1.2

  method: "PPO"                            # "PPO", "A2C", "REINFORCE"
  learning_rate: 0.0001

  rl_steps_per_epoch: 8                    # T, observation windows per epoch
  state_windows: [4, 8, 16]                # 0.5, 1, 2 epochs at T = 8

  lambda_ratio: 0.5                        # lambda_util
  lambda_delta: 0.0
  ema_alpha: 0.0

  entropy_beta_decay: False
  entropy_beta: 0.0

  ppo_epochs: 4
  ppo_clip: 0.2
